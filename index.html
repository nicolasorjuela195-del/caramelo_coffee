<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caramelo Coffee — Cotizaciones</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="cc-root">
    <div class="cc-wrap">
      <div class="cc-header">
        <h1>Caramelo</h1>
        <p class="cc-caption">COFFEE · COTIZACIONES</p>
        <p class="cc-desc">Registro compartido de proveedores y cotizaciones para armar el presupuesto del emprendimiento.</p>
      </div>

      <div class="cc-note-banner" id="cc-banner">Cargando datos…</div>

      <div class="cc-tabs">
        <button class="cc-tab active" data-tab="cotizaciones">Cotizaciones</button>
        <button class="cc-tab" data-tab="proveedores">Proveedores</button>
        <button class="cc-tab" data-tab="comparar">Comparar precios</button>
        <button class="cc-tab" data-tab="resumen">Resumen</button>
      </div>

      <div id="cc-view"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
